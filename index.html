<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina Scribe - Panel de Transcripciones</title>
    <!-- Favicon nativo en SVG -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎙️</text></svg>">
    <style>
        /* Variables de color profesionales */
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --border-color: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
        }

        .header {
            max-width: 1200px;
            margin: 0 auto 30px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            flex-wrap: wrap;
            gap: 15px;
        }

        /* Enlace de seguridad en el título */
        .header h1 a { 
            font-size: 1.8rem; 
            font-weight: 600; 
            color: var(--text-main);
            text-decoration: none;
            transition: opacity 0.2s;
        }
        .header h1 a:hover { opacity: 0.8; }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* Medidor de Balance */
        .balance-badge {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 8px 15px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--accent-green);
        }
        
        .btn-refresh {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }
        .btn-refresh:hover { background-color: #2563eb; }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        /* Estilo de las Tarjetas */
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .card-body textarea {
            width: 100%;
            min-height: 120px;
            background-color: #0b1120;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            font-size: 0.95rem;
            line-height: 1.5;
            resize: vertical;
            outline: none;
        }
        .card-body textarea:focus { border-color: var(--accent-blue); }

        /* Botones de acción */
        .actions {
            display: flex;
            gap: 8px;
            margin-top: auto;
        }
        .btn {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 5px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            color: white;
            transition: opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        .btn:hover { opacity: 0.8; }
        .btn-copy { background-color: var(--border-color); }
        .btn-save { background-color: var(--accent-green); }
        .btn-delete { background-color: var(--accent-red); }

        /* Notificaciones flotantes */
        #toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background-color: var(--text-main);
            color: var(--bg-color);
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 600;
            opacity: 0;
            transition: transform 0.3s, opacity 0.3s;
            z-index: 1000;
        }
        #toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* Estado de carga */
        #loader {
            text-align: center;
            color: var(--text-muted);
            font-size: 1.2rem;
            margin-top: 50px;
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>

    <div class="header">
        <!-- Título con enlace de seguridad -->
        <h1><a href="https://industriastech.github.io/Lumina-Scribe-Pro/">🎙️ Lumina Scribe</a></h1>
        
        <div class="header-controls">
            <!-- Medidor de Balance en tiempo real -->
            <div class="balance-badge" id="balance-display">💰 Saldo: Consultando...</div>
            <button class="btn-refresh" onclick="cargarDatos()">🔄 Actualizar Panel</button>
        </div>
    </div>

    <div class="container" id="tarjetas-container">
        <!-- Las tarjetas se inyectarán aquí mediante JavaScript -->
    </div>

    <div id="toast">Notificación</div>

    <script>
        // La NUEVA URL de tu Google Apps Script
        const API_URL = 'https://script.google.com/macros/s/AKfycbxSXK_qPndPiHsPlImbLSizBdFBC2JrnfnuvG4G-Mfe2oMKnlx8H_4M9IsY1sBAy0S4/exec';

        document.addEventListener('DOMContentLoaded', cargarDatos);

        async function cargarDatos() {
            const container = document.getElementById('tarjetas-container');
            const balanceDisplay = document.getElementById('balance-display');
            
            container.innerHTML = '<div id="loader">Conectando con la base de datos... ⏳</div>';
            balanceDisplay.innerText = "💰 Saldo: Consultando...";

            try {
                const respuesta = await fetch(API_URL);
                const datosServidor = await respuesta.json();
                
                // Actualizar el saldo exacto devuelto por Deepgram
                balanceDisplay.innerText = `💰 Saldo: $${datosServidor.saldo} USD`;
                
                // Renderizar los textos
                renderizarTarjetas(datosServidor.transcripciones);
            } catch (error) {
                console.error(error);
                container.innerHTML = '<div id="loader">❌ Error de conexión. Revisa tu internet o la URL.</div>';
                balanceDisplay.innerText = "💰 Saldo: Error";
                mostrarToast("Error al cargar los datos");
            }
        }

        function renderizarTarjetas(datos) {
            const container = document.getElementById('tarjetas-container');
            container.innerHTML = '';

            if (!datos || datos.length === 0) {
                container.innerHTML = '<div id="loader">📭 No hay transcripciones activas. Envía un audio por Telegram.</div>';
                return;
            }

            datos.forEach((registro, index) => {
                const fecha = new Date(registro.fecha).toLocaleString('es-ES', { dateStyle: 'short', timeStyle: 'short' });
                
                const card = document.createElement('div');
                card.className = 'card';
                // Ahora usamos el registro.id único en lugar del número de fila para las funciones
                card.innerHTML = `
                    <div class="card-header">
                        <span>Registro ID: ${registro.id}</span>
                        <span>🕒 ${fecha}</span>
                    </div>
                    <div class="card-body">
                        <textarea id="texto-${registro.id}">${registro.texto}</textarea>
                    </div>
                    <div class="actions">
                        <button class="btn btn-copy" onclick="copiarTexto('texto-${registro.id}')">📋 Copiar</button>
                        <button class="btn btn-save" onclick="guardarEdicion('${registro.id}', 'texto-${registro.id}')">💾 Guardar</button>
                        <button class="btn btn-delete" onclick="eliminarRegistro('${registro.id}')">🗑️ Eliminar</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Función para copiar al portapapeles
        function copiarTexto(idElemento) {
            const texto = document.getElementById(idElemento).value;
            navigator.clipboard.writeText(texto).then(() => {
                mostrarToast("✅ Texto copiado al portapapeles");
            }).catch(err => {
                mostrarToast("❌ Error al copiar");
            });
        }

        // Función para editar en Google Sheets (usando ID único)
        async function guardarEdicion(idUnico, idElemento) {
            const nuevoTexto = document.getElementById(idElemento).value;
            mostrarToast("💾 Guardando cambios...");

            try {
                await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        origen: 'web',
                        accion: 'editar',
                        id: idUnico,
                        nuevoTexto: nuevoTexto
                    })
                });
                mostrarToast("✅ Edición guardada con éxito");
            } catch (error) {
                mostrarToast("❌ Error al guardar");
            }
        }

        // Función para eliminar total (Destrucción manual por ID único)
        async function eliminarRegistro(idUnico) {
            if (!confirm("⚠️ ¿Estás seguro de que deseas destruir esta transcripción ahora mismo?")) return;
            
            mostrarToast("🗑️ Destruyendo registro...");

            try {
                await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        origen: 'web',
                        accion: 'eliminar',
                        id: idUnico
                    })
                });
                mostrarToast("✅ Registro destruido");
                cargarDatos(); // Recargar la lista
            } catch (error) {
                mostrarToast("❌ Error al eliminar");
            }
        }

        function mostrarToast(mensaje) {
            const toast = document.getElementById('toast');
            toast.innerText = mensaje;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
